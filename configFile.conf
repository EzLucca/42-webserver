server {
    listen 8080;                  # Port to listen on 
        host 127.0.0.1;               # Interface 
        server_name mysite.com;       # Optional, but good for testing 
        client_max_body_size 10M;     # Limit for uploads 
        error_page 404 /404.html;     # Default error page 
        error_page 403 /403.html;     # Default error page 

# Rule for a specific route (URL)
        location / {
            root /var/www/html;       # Where the files live 
                index index.html;         # Default file 
                allow_methods GET POST;   # Accepted methods 
                autoindex on;             # Directory listing 
        }

# Rule for uploading files 
    location /upload {
        root /var/www/uploads;
        allow_methods POST;
        upload_enable on;         # Custom flag to authorize uploads 
    }

# Rule for CGI scripts 
    location /cgi-bin {
        allowed_methods GET POST;
        root ./sites/cgi/cgi-bin;
        cgi_pass /usr/bin/python3;        # Python interpreter
            cgi_ext .py;                      # File extension for CGI scripts
    }

# CGI location for PHP scripts
    location /php {
        allowed_methods GET POST;
        root ./sites/cgi;
        cgi_pass /usr/bin/php-cgi;        # PHP-CGI interpreter
            cgi_ext .php;
    }

# CGI location for shell scripts
    location /scripts {
        allowed_methods GET POST;
        root ./sites/cgi;
        cgi_pass /bin/bash;               # Bash interpreter
            cgi_ext .sh;
    }
}

