server {
    listen 8080;
    host 127.0.0.1;
    server_name mysite.com;
    client_max_body_size 10M;
    error_page 400 var/www/errorpages/400.html;
    error_page 403 var/www/errorpages/403.html;
    error_page 404 var/www/errorpages/404.html;
    error_page 405 var/www/errorpages/405.html;
    error_page 414 var/www/errorpages/414.html;
    error_page 501 var/www/errorpages/501.html;
    error_page 505 var/www/errorpages/505.html;

    location / {
        root var/www/html;
        index index.html;
        allowed_methods GET POST;
        autoindex on;
   } 

    location /upload {
        root var/www/uploads;
        allowed_methods POST GET DELETE;
#        index default.html;
        upload_enable on;
        autoindex on;
        client_max_body_size 10M;
    }

    location /cgi {
        root var;
        allowed_methods GET POST;
        cgi_pass /usr/bin/python3;
        cgi_ext .py;
    }

    location /cgi-bin {
        root var/cgi;
        allowed_methods GET POST;
        cgi_pass /usr/bin/python3;
        cgi_ext .py;
    }
}

server { 
