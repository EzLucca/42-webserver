server { 
    listen 8080;
    host 127.0.0.1;
    server_name mysite.com;
    client_max_body_size 10M;
    error_page 404 /var/www/errorpages/404.html;
    error_page 403 /var/www/errorpages/403.html;;

    location / {
        root /var/www/html;
        index index.html;
        allow_methods GET POST;
        autoindex on;
    }

    location /upload {
        root /var/www/uploads;
        allow_methods POST;
        upload_enable on;
    }

    location /cgi {
        root /var/cgi;
        allowed_methods GET POST;
        cgi_pass /usr/bin/python3;
        cgi_ext .py;
    }

    location /cgi-bin {
        root /var/cgi/cgi-bin;
        allowed_methods GET POST;
        cgi_pass /usr/bin/python3;
        cgi_ext .py;
    }
}
